name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      upload_to_store:
        description: 'Upload to Chrome Web Store'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        id: bump_version
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Bump version in package.json
          npm version ${{ inputs.version_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"

          # Sync version to manifest.json
          node scripts/sync-version.js

          # Commit and tag
          git add package.json public/manifest.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "Release version $NEW_VERSION"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Get version from tag (tag push)
        if: github.event_name == 'push'
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set version output
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ steps.bump_version.outputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=${{ steps.bump_version.outputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.get_version.outputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=${{ steps.get_version.outputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Create ZIP
        run: npm run zip

      - name: Rename ZIP with version
        run: |
          mv chrome-translation-assistant.zip chrome-translation-assistant-${{ steps.version.outputs.tag }}.zip

      - name: Push version bump (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git push origin main
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        if: inputs.create_release != false
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: chrome-translation-assistant-${{ steps.version.outputs.tag }}.zip
          body: |
            ## Chrome Extension Release ${{ steps.version.outputs.tag }}

            ### Installation

            1. Download `chrome-translation-assistant-${{ steps.version.outputs.tag }}.zip`
            2. Extract the ZIP file
            3. Open Chrome → `chrome://extensions/`
            4. Enable "Developer mode"
            5. Click "Load unpacked"
            6. Select the extracted folder

            ### Configuration

            1. Click extension icon → Options
            2. Select AI Provider (Claude/OpenAI/Gemini)
            3. Enter your API key
            4. Save settings

            ### What's Changed

            See [commit history](https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.tag }}) for details.

            ---

            **Note**: You need your own API key from Claude, OpenAI, or Gemini to use this extension.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Chrome Web Store
        if: inputs.upload_to_store == true
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ -z "$CHROME_EXTENSION_ID" ]; then
            echo "⚠️ Chrome Web Store credentials not configured. Skipping upload."
            echo "To enable, add these secrets: CHROME_EXTENSION_ID, CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN"
            exit 0
          fi

          npm install -g chrome-webstore-upload-cli

          chrome-webstore-upload upload \
            --source chrome-translation-assistant-${{ steps.version.outputs.tag }}.zip \
            --extension-id $CHROME_EXTENSION_ID \
            --client-id $CHROME_CLIENT_ID \
            --client-secret $CHROME_CLIENT_SECRET \
            --refresh-token $CHROME_REFRESH_TOKEN

      - name: Release Summary
        run: |
          echo "✅ Release completed!"
          echo ""
          echo "📦 Version: ${{ steps.version.outputs.tag }}"
          echo "📁 ZIP: chrome-translation-assistant-${{ steps.version.outputs.tag }}.zip"
          echo ""
          if [ "${{ inputs.upload_to_store }}" == "true" ]; then
            echo "🏪 Chrome Web Store: Upload attempted"
          else
            echo "🏪 Chrome Web Store: Skipped (not requested)"
          fi
